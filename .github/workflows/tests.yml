name: Tests

# Runs the PHP suite on every push and pull request: on the latest WordPress with
# current PHP (single site and multisite), on the PHP floor, and on the WordPress
# floor. This workflow used to run on
# pull requests to develop and main only, and this repo merges without pull
# requests, so it never ran: until it moved to push, the suite had only ever run
# on a Mac.
#
# deployable.yml is a separate workflow and is untouched by this one. Each job
# gets its own checkout, so a test job cannot contaminate the deployable check.
#
# bin/e2e.js is not run here. It needs a real WordPress site, a browser and a
# claim on that site.

on: [push, pull_request]

# One run per branch at a time. A newer push cancels the run it replaces.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHP suite
    runs-on: ubuntu-latest

    services:
      mysql:
        # The official image refuses to start without MYSQL_ROOT_PASSWORD or
        # MYSQL_ALLOW_EMPTY_PASSWORD, hence the explicit password threaded below.
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      WP_TESTS_DIR: /tmp/wordpress-tests-lib
      WP_CORE_DIR: /tmp/wordpress

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          # Current stable, the same PHP the suite runs on locally. The floor
          # job below runs it on the oldest PHP the plugin claims.
          php-version: '8.4'
          extensions: dom, libxml, mbstring, json, mysqli
          coverage: none
          tools: composer

      # The committed tree is --no-dev, so phpunit is not in it. composer.lock is
      # committed, so this resolves the same versions every time. --no-scripts
      # keeps a drifted lock from running the bot-pattern update and skips the
      # local git hook, which a runner has no use for. All three VCS packages
      # (mai-logger, mai-package-loader, deployable-guard) are public, so no
      # token is needed.
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Install the WordPress test harness
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest

      - name: Run the PHP suite
        run: composer test

      # The plugin runs on multisite too. The test library reads WP_MULTISITE.
      - name: Run the PHP suite on multisite
        env:
          WP_MULTISITE: 1
        run: composer test

  floor:
    name: PHP floor
    runs-on: ubuntu-latest

    # The oldest PHP the plugin claims to run on. This repo declares it in the
    # plugin header ("Requires PHP"), not in composer.json, so the job reads it
    # from there rather than repeating the number. Raising the floor moves this
    # job with it.
    #
    # The suite's dev tooling (phpunit 9.6) installs on the floor, so the whole
    # suite runs here too, not only a parse check.

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      WP_TESTS_DIR: /tmp/wordpress-tests-lib
      WP_CORE_DIR: /tmp/wordpress

    steps:
      - uses: actions/checkout@v5

      - name: Read the declared floor
        id: floor
        run: |
          floor=$(grep -m1 -E '^\s*\*\s*Requires PHP:' mai-analytics.php | grep -oE '[0-9]+(\.[0-9]+)+')
          if [ -z "$floor" ]; then
            echo "::error::No 'Requires PHP' found in the mai-analytics.php header."
            exit 1
          fi
          echo "Declared floor: $floor"
          echo "version=$floor" >> "$GITHUB_OUTPUT"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ steps.floor.outputs.version }}
          extensions: dom, libxml, mbstring, json, mysqli
          coverage: none
          tools: composer

      - name: Plugin code parses
        run: |
          find src includes -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          php -l mai-analytics.php > /dev/null
          php -l uninstall.php > /dev/null

      # The deployed tree is this checkout as-is, with no composer on the server,
      # so this is the same require a real request makes. It runs before
      # composer install, which would replace the committed vendor/.
      - name: The committed autoloader loads
        run: php -r 'require "vendor/autoload.php"; echo "autoloader ok\n";'

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Install the WordPress test harness
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest

      - name: Run the PHP suite
        run: composer test

  wp-floor:
    name: WordPress floor
    runs-on: ubuntu-latest

    # The oldest WordPress the plugin claims to run on, with the oldest PHP. Both
    # come from the plugin header ("Requires at least" and "Requires PHP"), so
    # raising either floor moves this job with it. The other jobs use the latest
    # WordPress.

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      WP_TESTS_DIR: /tmp/wordpress-tests-lib
      WP_CORE_DIR: /tmp/wordpress

    steps:
      - uses: actions/checkout@v5

      - name: Read the declared floors
        id: floor
        run: |
          php=$(grep -m1 -E '^\s*\*\s*Requires PHP:' mai-analytics.php | grep -oE '[0-9]+(\.[0-9]+)+')
          wp=$(grep -m1 -E '^\s*\*\s*Requires at least:' mai-analytics.php | grep -oE '[0-9]+(\.[0-9]+)+')
          if [ -z "$php" ] || [ -z "$wp" ]; then
            echo "::error::'Requires PHP' or 'Requires at least' is missing from the mai-analytics.php header."
            exit 1
          fi
          echo "Declared floors: PHP $php, WordPress $wp"
          echo "php=$php" >> "$GITHUB_OUTPUT"
          echo "wp=$wp" >> "$GITHUB_OUTPUT"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ steps.floor.outputs.php }}
          extensions: dom, libxml, mbstring, json, mysqli
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts

      # A bare major.minor version installs that branch's latest point release
      # and its test library.
      - name: Install the WordPress test harness
        env:
          WP_FLOOR: ${{ steps.floor.outputs.wp }}
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 "$WP_FLOOR"

      - name: Run the PHP suite
        run: composer test
